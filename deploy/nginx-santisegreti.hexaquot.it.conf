# Santi Segreti: /etc/nginx/conf.d/santisegreti.hexaquot.it.conf
# L'apex è l'URL canonico, www rimanda lì. Il certificato copre entrambi i nomi.
server {
    listen 80;
    server_name santisegreti.hexaquot.it www.santisegreti.hexaquot.it;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://santisegreti.hexaquot.it$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name santisegreti.hexaquot.it;

    ssl_certificate /etc/letsencrypt/live/santisegreti.hexaquot.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/santisegreti.hexaquot.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 2M;

    location / {
        # Docker pubblica la porta solo su loopback IPv4: `localhost` potrebbe
        # risolvere in ::1 e dare 502 intermittenti.
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl http2;
    server_name www.santisegreti.hexaquot.it;

    ssl_certificate /etc/letsencrypt/live/santisegreti.hexaquot.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/santisegreti.hexaquot.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://santisegreti.hexaquot.it$request_uri;
}
